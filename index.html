<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今のあんた、何色なん。</title>
<style>
:root{--ink:#342d3d;--paper:#fffaf4;--pink:#ff5f8f;--shadow:0 14px 35px rgba(68,43,72,.14)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:
radial-gradient(circle at 15% 5%,#ffe5ef 0 10%,transparent 25%),
radial-gradient(circle at 90% 15%,#fff0b7 0 10%,transparent 25%),
linear-gradient(160deg,#fffaf4,#f8f1ff);min-height:100vh}
.wrap{width:min(720px,100%);margin:auto;padding:22px 16px 48px}.card{background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:28px;padding:22px;box-shadow:var(--shadow);text-align:center}
h1{font-size:clamp(30px,8vw,52px);line-height:1.05;margin:10px 0} .sub{font-weight:800;color:#765f79}.hero{width:min(290px,80%);max-height:280px;object-fit:contain;margin:4px auto 8px;display:block}
button{font:inherit;border:0;cursor:pointer}.mainbtn{width:100%;padding:17px;border-radius:999px;background:linear-gradient(90deg,#ff5f8f,#ff8c61);color:#fff;font-weight:900;font-size:19px;box-shadow:0 8px 18px #ff769455}
.screen{display:none}.screen.active{display:block;animation:pop .35s ease}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.progress{display:flex;gap:8px;justify-content:center;margin:12px}.dot{width:12px;height:12px;border-radius:50%;background:#ddd}.dot.on{background:#ff5f8f;transform:scale(1.2)}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.color{min-height:82px;border-radius:20px;border:3px solid rgba(255,255,255,.85);box-shadow:0 5px 13px #463c4a20;font-weight:900;text-shadow:0 1px 3px #fff9;transition:.15s}.color:active{transform:scale(.93)}.dark{color:#fff;text-shadow:0 1px 3px #000}
.picks{display:flex;justify-content:center;gap:9px;min-height:40px}.pick{width:36px;height:36px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #0003}
.loader{padding:35px 5px}.spin{font-size:52px;display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.result{background:#fff;border:3px solid #ffd6e3;border-radius:26px;padding:18px;text-align:left}.result h2{text-align:center;margin:4px 0 16px}.box{background:#fff8fb;border-radius:18px;padding:13px 15px;margin:10px 0}.label{font-weight:900;color:#d84775}.big{font-size:21px;font-weight:900;line-height:1.55;background:linear-gradient(135deg,#fff0a9,#ffe1ec);border-radius:18px;padding:16px;margin:13px 0}.extra{font-weight:900;text-align:center;padding:15px;border:2px dashed #ff779e;border-radius:18px}.actions{display:grid;gap:9px;margin-top:14px}.secondary{padding:14px;border-radius:999px;background:#eee7f4;font-weight:900;color:#4b3c52}.line{background:#06c755;color:#fff;text-decoration:none;padding:14px;border-radius:999px;font-weight:900;text-align:center}.note{font-size:12px;color:#857986;margin-top:16px;line-height:1.5}
@media(min-width:520px){.colors{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><main class="wrap">
<section id="start" class="screen active"><div class="card">
<img class="hero" src="umeko_top.PNG" alt="うめこ" onerror="this.style.display='none'">
<div class="sub">考えたら負け。直感でいけ🤣</div>
<h1>今のあんた、<br>何色なん。</h1>
<p><b>3色選んだら、だいたいバレる。</b><br>12色から「なんとなく」で3回選んでな。</p>
<button class="mainbtn" onclick="begin()">中身、バラされに行く🤣</button>
<div class="note">遊びとして楽しむカラー診断です。医療・心理検査ではありません。入力内容は外部へ送信しません。</div>
</div></section>

<section id="choose" class="screen"><div class="card">
<img class="hero" src="umeko_check.png" alt="考えるうめこ" onerror="this.style.display='none'">
<div class="progress"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<h2 id="question"></h2><div class="picks" id="picks"></div>
<div class="colors" id="colors"></div>
<p class="sub">理由はいらん。「これ」で押せ🤣</p>
</div></section>

<section id="loading" class="screen"><div class="card loader">
<div class="spin">🔍</div><h2>うめこ解析中……</h2>
<p><b>ちょっと待て。今あんたの中身バラしてる🤣</b></p>
</div></section>

<section id="finish" class="screen"><div class="card">
<img class="hero" src="umeko_result.png" alt="結果発表うめこ" onerror="this.style.display='none'">
<div class="result" id="resultCard"><h2>🎨 本日のバレました結果</h2>
<div class="picks" id="resultPicks"></div>
<div class="box"><div class="label">① 外に見せてるあんた</div><div id="r1"></div></div>
<div class="box"><div class="label">② 誰にも見せてないあんた</div><div id="r2"></div></div>
<div class="box"><div class="label">③ 今ほんまに欲しいもん</div><div id="r3"></div></div>
<div class="big" id="summary"></div>
<div class="extra">🥸 うめこの余計なひと言<br><span id="extra"></span></div>
</div>
<div class="actions">
<button class="mainbtn" onclick="restart()">もう一回バラす🤣</button>
<button class="secondary" onclick="shareResult()">友達にもやらせる</button>
<a class="line" href="https://lin.ee/O23Sb7o" target="_blank" rel="noopener">うめこの公式LINEへ</a>
</div></div></section>
</main>
<script>
const palette=[
{name:"赤",c:"#ef4444",out:"勢いと存在感で前に出る人。やると決めたら早い。",inside:"ほんまは結果を出したい気持ちが強め。止まるより動いていたい。",need:"遠慮せず『これやりたい』を一個通すこと。"},
{name:"ピンク",c:"#ff86ad",out:"やわらかく、人との空気を大事にしてる人。",inside:"優しくされたいし、自分にももうちょい優しくしたい。",need:"気を遣わんでええ時間。甘やかしも今日は仕事や🤣"},
{name:"オレンジ",c:"#f97316",out:"ノリと親しみやすさで場を動かす人。",inside:"退屈がいちばん苦手。楽しい刺激を探してる。",need:"笑える予定を一個。義務だけで一日埋めるな。"},
{name:"黄",c:"#facc15",out:"明るく軽やか。好奇心であちこちアンテナ立ってる人。",inside:"頭の中は思った以上に忙しい。次の面白いこと考え中。",need:"考えるだけで終わらん小さな一歩。"},
{name:"黄緑",c:"#a3e635",out:"新しいものを取り入れるのが上手。伸びしろ探し中の人。",inside:"変わりたい気持ちと、今のままでもええ気持ちが同居中。",need:"全部変えずに一個だけ新しくすること。"},
{name:"緑",c:"#22c55e",out:"落ち着いて見えて、周りの調整もできる人。",inside:"平和が欲しい。揉め事と余計な予定は今日は要らん。",need:"余白。何もしない時間を予定として確保。"},
{name:"水色",c:"#67d7e8",out:"爽やかで話しやすい。風通しを作る人。",inside:"重たい空気から離れて、ちょっと自由になりたい。",need:"場所か気分を変えること。外の空気でも十分。"},
{name:"青",c:"#3b82f6",out:"冷静でちゃんとして見える人。任されるとやる。",inside:"実は静かに考えたい。雑音が多いと電池が減る。",need:"一人で頭を整理する時間。返事はあとでもええ🤣"},
{name:"紫",c:"#8b5cf6",out:"自分の世界観を持ってる人。普通だけでは物足りん。",inside:"『分かる人だけ分かって』な部分を大事にしてる。",need:"好きなものにどっぷり浸かる時間。"},
{name:"茶",c:"#9a6a45",out:"堅実で地に足ついてる人。結局ちゃんとやる。",inside:"安心できる土台を確認したい気分。",need:"生活を一個整えること。机でも財布でもええ。"},
{name:"白",c:"#f8fafc",border:"#cbd5e1",out:"すっきり、ニュートラルに見せたい人。",inside:"一回リセットしたい。情報も予定もちょっと多い。",need:"足すより減らす。今日は一個やめて正解。"},
{name:"黒",c:"#20242c",dark:true,out:"ブレへん雰囲気。簡単には中身を見せへん人。",inside:"自分のペースと境界線を守りたい気分。",need:"嫌なもんにちゃんとNO。愛想笑いは省エネ対象🤣"}
];
const qs=[
"1色目｜外に見せてる自分。今いちばん気になる色は？",
"2色目｜誰にも見せてない自分。次に惹かれる色は？",
"3色目｜今ほんまに欲してるもの。最後はどれ？"
];
const extras=[
"休みたい日に予定検索すな🤣","全部今日やらんでええ。明日の自分にも仕事残しとけ🤣",
"『せっかくやし』で予定増やすな🤣","やる気待ちしてたら日ぃ暮れる。1ミリだけやれ。",
"人の機嫌まで担当業務に入れんな🤣","迷ったら、いったん腹減ってないか確認せえ🤣",
"余白はサボりちゃう。詰め込み過ぎ防止装置や。","答え出えへん日は、寝てから考えたらええ🤣"
];
let picks=[];
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function begin(){picks=[];show("choose");render()}
function render(){
 document.getElementById("question").textContent=qs[picks.length];
 document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on",i<=picks.length));
 document.getElementById("picks").innerHTML=picks.map(dot).join("");
 const el=document.getElementById("colors");el.innerHTML="";
 palette.forEach((x,i)=>{let b=document.createElement("button");b.className="color"+(x.dark?" dark":"");b.textContent=x.name;b.style.background=x.c;if(x.border)b.style.borderColor=x.border;b.onclick=()=>pick(i);el.appendChild(b)})
}
function dot(i){const x=palette[i];return `<span class="pick" title="${x.name}" style="background:${x.c};${x.border?'border-color:'+x.border:''}"></span>`}
function pick(i){picks.push(i);if(picks.length<3){render()}else{show("loading");setTimeout(result,1250)}}
function result(){
 const a=palette[picks[0]],b=palette[picks[1]],c=palette[picks[2]];
 document.getElementById("resultPicks").innerHTML=picks.map(dot).join("");
 r1.textContent=a.out;r2.textContent=b.inside;r3.textContent=c.need;
 const same=new Set(picks).size;
 let lead=same===1?"同じ色を3回選ぶあたり、今日は気持ちがかなりハッキリしとる。":
 same===2?"同じ色がかぶったな。今は一個のテーマが強めに出てるで。":
 "3色バラバラ。今のあんた、ひとことで片付けられへん🤣";
 summary.textContent=`💥 3色まとめてバラすと\n「${lead} 外では${a.name}、内側は${b.name}、欲しいのは${c.name}の要素。今日は『全部ちゃんと』より、今いちばん気になることを一個でええ。」`;
 extra.textContent=extras[(picks[0]*7+picks[1]*3+picks[2])%extras.length];
 show("finish")
}
function restart(){picks=[];show("choose");render()}
async function shareResult(){
 const text="『今のあんた、何色なん。』3色選んだら、だいたいバレる🤣";
 if(navigator.share){try{await navigator.share({title:"今のあんた、何色なん。",text,url:location.href});return}catch(e){}}
 try{await navigator.clipboard.writeText(location.href);alert("URLコピーしたで🤣")}catch(e){alert("このページのURLをコピーして友達に送ってな🤣")}
}
</script></body></html>
